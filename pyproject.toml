[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-analyzer"
version = "0.1.0"
description = "Financial Analyzer using Flask and Google GenAI"
authors = [
    {name = "Penguin", email = "g3casas@gmail.com"}
]
dependencies = [
    "flask>=3.0.0",
    "pandas>=2.0.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "werkzeug>=3.0.0"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest"
]
